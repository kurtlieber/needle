# needle releases (ADR 0007). On every push to main, release-please keeps a release PR up to date from the
# conventional commits. Merging that PR tags vX.Y.Z and creates the GitHub Release;
# this workflow then builds and signs the package and publishes it twice:
#   - as assets on the GitHub Release (package, .sig, SHA256SUMS, signing key)
#   - as an OCI artifact at ghcr.io/kurtlieber/needle:X.Y.Z and :latest (the repo's Packages panel)
# Run it by hand (workflow_dispatch) with an existing tag to rebuild and republish that release.
name: needle-release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to rebuild and publish (e.g. v0.3.0)
        required: true

permissions: {}

concurrency:
  group: needle-release
  cancel-in-progress: false

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      created: ${{ steps.rp.outputs.release_created }}
      tag: ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: rp
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # The release PR asks the repository owner for review, so it shows under "Review requested".
      - name: Request review on the release PR
        if: steps.rp.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PRS: ${{ steps.rp.outputs.prs }}
        run: |
          for n in $(jq -r '.[].number' <<<"$PRS"); do
            gh pr edit "$n" -R "$GITHUB_REPOSITORY" --add-reviewer "$GITHUB_REPOSITORY_OWNER"
          done

  tag:
    needs: release-please
    if: always() && (needs.release-please.outputs.created == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.t.outputs.tag }}
      version: ${{ steps.t.outputs.version }}
    steps:
      - id: t
        env:
          TAG: ${{ needs.release-please.outputs.tag || inputs.tag }}
        run: |
          case "$TAG" in v[0-9]*) ;; *) echo "::error::not a release tag: $TAG"; exit 1;; esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

  build:
    needs: tag
    if: always() && needs.tag.result == 'success'
    permissions:
      contents: read
    uses: ./.github/workflows/needle-build.yml
    with:
      ref: refs/tags/${{ needs.tag.outputs.tag }}

  # The only job that can read NEEDLE_SIGNING_KEY: it lives in the `release` environment, which only main may use.
  publish:
    needs: [tag, build]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      packages: write
    env:
      TAG: ${{ needs.tag.outputs.tag }}
      VERSION: ${{ needs.tag.outputs.version }}
      PKG: ${{ needs.build.outputs.package }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ needs.tag.outputs.tag }}
          sparse-checkout: app/pkgbuild

      - uses: actions/download-artifact@v4
        with:
          name: needle-pkg
          path: dist

      - name: Sign
        working-directory: dist
        env:
          NEEDLE_SIGNING_KEY: ${{ secrets.NEEDLE_SIGNING_KEY }}
        run: |
          if [ -z "$NEEDLE_SIGNING_KEY" ]; then echo "::error::secret NEEDLE_SIGNING_KEY is not set in environment release"; exit 1; fi
          export GNUPGHOME="$(mktemp -d)"
          printf '%s\n' "$NEEDLE_SIGNING_KEY" | gpg --batch --import
          gpg --batch --detach-sign --no-armor "$PKG"
          gpg --batch --verify "$PKG.sig" "$PKG"
          rm -rf "$GNUPGHOME"

      - name: Checksums and signing key
        working-directory: dist
        run: |
          cp ../app/pkgbuild/needle-signing-key.asc .
          sha256sum "$PKG" "$PKG.sig" needle-signing-key.asc > SHA256SUMS
          cat SHA256SUMS

      - name: Attach to the GitHub Release
        working-directory: dist
        run: gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber "$PKG" "$PKG.sig" SHA256SUMS needle-signing-key.asc

      - uses: oras-project/setup-oras@v1

      - name: Push to ghcr.io
        working-directory: dist
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/needle"
          oras login ghcr.io -u "$GITHUB_ACTOR" --password-stdin <<<"$GH_TOKEN"
          oras push "$image:$VERSION,latest" \
            --artifact-type application/vnd.archlinux.package.v1 \
            --annotation "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --annotation "org.opencontainers.image.title=needle" \
            --annotation "org.opencontainers.image.description=needle $VERSION: Arch package (pacman -U). Pull with oras." \
            --annotation "org.opencontainers.image.version=$VERSION" \
            --annotation "org.opencontainers.image.licenses=MIT AND OFL-1.1" \
            "$PKG:application/vnd.archlinux.package.v1+zstd" \
            "$PKG.sig:application/pgp-signature" \
            SHA256SUMS:text/plain
          echo "::notice::Published $image:$VERSION"

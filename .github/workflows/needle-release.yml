# needle releases (ADR 0007). On every push to main, release-please keeps a release PR up to date from the
# conventional commits. Merging that PR tags vX.Y.Z and creates the GitHub Release as a draft; this workflow then
# builds and signs the package, attaches it with a one-package pacman repository (needle.db), and publishes the
# release. pacman reads the repository from releases/latest/download, so the release only goes public once it holds
# everything. The best-effort .deb and .rpm are attached after that; their failure doesn't hold up the release.
# Once the release is public, the site job starts lieber.org's deploy so its needle page shows the new version.
# Run it by hand (workflow_dispatch) with an existing tag to rebuild and republish that release.
name: needle-release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to rebuild and publish (e.g. v0.3.0)
        required: true

permissions: {}

concurrency:
  group: needle-release
  cancel-in-progress: false

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      created: ${{ steps.rp.outputs.release_created }}
      tag: ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: rp
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # The release PR asks the repository owner for review, so it shows under "Review requested".
      - name: Request review on the release PR
        if: steps.rp.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PRS: ${{ steps.rp.outputs.prs }}
        run: |
          for n in $(jq -r '.[].number' <<<"$PRS"); do
            gh pr edit "$n" -R "$GITHUB_REPOSITORY" --add-reviewer "$GITHUB_REPOSITORY_OWNER"
          done

  tag:
    needs: release-please
    if: always() && (needs.release-please.outputs.created == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.t.outputs.tag }}
      version: ${{ steps.t.outputs.version }}
    steps:
      - id: t
        env:
          TAG: ${{ needs.release-please.outputs.tag || inputs.tag }}
        run: |
          case "$TAG" in v[0-9]*) ;; *) echo "::error::not a release tag: $TAG"; exit 1;; esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

  build:
    needs: tag
    if: always() && needs.tag.result == 'success'
    permissions:
      contents: read
    uses: ./.github/workflows/needle-build.yml
    with:
      ref: refs/tags/${{ needs.tag.outputs.tag }}

  build-other:
    needs: tag
    if: always() && needs.tag.result == 'success'
    permissions:
      contents: read
    uses: ./.github/workflows/needle-build-other.yml
    with:
      ref: refs/tags/${{ needs.tag.outputs.tag }}

  # The only job that can read NEEDLE_SIGNING_KEY: it lives in the `release` environment, which only main may use.
  publish:
    needs: [tag, build]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    container: archlinux:base
    environment: release
    permissions:
      contents: write
    env:
      TAG: ${{ needs.tag.outputs.tag }}
      PKG: ${{ needs.build.outputs.package }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Install tools
        run: pacman -Syu --noconfirm --needed git github-cli

      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ needs.tag.outputs.tag }}
          sparse-checkout: app/pkgbuild

      - uses: actions/download-artifact@v4
        with:
          name: needle-pkg
          path: dist

      # The package and the repository database are signed with the same key; pacman checks both.
      - name: Sign, and make the pacman repository
        working-directory: dist
        env:
          NEEDLE_SIGNING_KEY: ${{ secrets.NEEDLE_SIGNING_KEY }}
        run: |
          if [ -z "$NEEDLE_SIGNING_KEY" ]; then echo "::error::secret NEEDLE_SIGNING_KEY is not set in environment release"; exit 1; fi
          export GNUPGHOME="$(mktemp -d)"
          printf '%s\n' "$NEEDLE_SIGNING_KEY" | gpg --batch --import
          gpg --batch --detach-sign --no-armor "$PKG"
          gpg --batch --verify "$PKG.sig" "$PKG"
          repo-add --sign needle.db.tar.zst "$PKG"
          rm -rf "$GNUPGHOME"
          # repo-add leaves needle.db and needle.files as symlinks; a release asset has to be the file itself
          for f in needle.db needle.db.sig needle.files needle.files.sig; do cp --remove-destination "$(readlink "$f")" "$f"; done
          rm needle.db.tar.zst* needle.files.tar.zst*

      - name: Checksums and signing key
        working-directory: dist
        run: |
          cp ../app/pkgbuild/needle-signing-key.asc .
          sha256sum "$PKG" "$PKG.sig" needle.db needle.files needle-signing-key.asc > SHA256SUMS
          cat SHA256SUMS

      - name: Attach to the GitHub Release
        working-directory: dist
        run: |
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber "$PKG" "$PKG.sig" \
            needle.db needle.db.sig needle.files needle.files.sig SHA256SUMS needle-signing-key.asc

      # A rebuild of a published release leaves it as it is (and doesn't make an older one the latest).
      - name: Publish the release
        run: |
          if [ "$(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json isDraft -q .isDraft)" = true ]; then
            gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --draft=false --latest
            echo "::notice::Published $TAG"
          fi

  publish-other:
    needs: [tag, publish, build-other]
    if: always() && needs.publish.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.tag.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: needle-other-*
          merge-multiple: true
          path: dist

      - name: Attach the .deb and .rpm to the GitHub Release
        working-directory: dist
        run: |
          shopt -s nullglob
          files=(*.deb *.rpm)
          if [ ${#files[@]} -eq 0 ]; then echo "::warning::no .deb or .rpm built for $TAG"; exit 0; fi
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" --pattern SHA256SUMS
          grep -v -E '\.(deb|rpm)$' SHA256SUMS > sums || true
          sha256sum "${files[@]}" >> sums
          mv sums SHA256SUMS
          cat SHA256SUMS
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber "${files[@]}" SHA256SUMS

  # lieber.org shows needle's newest release. Starting its deploy now saves waiting up to three hours for its own
  # check. LIEBER_ORG_DEPLOY_TOKEN can only start lieber.org's workflows; without it, the site catches up on its own.
  site:
    needs: publish
    if: always() && needs.publish.result == 'success'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.LIEBER_ORG_DEPLOY_TOKEN }}
    steps:
      - name: Start lieber.org's deploy
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "::warning::secret LIEBER_ORG_DEPLOY_TOKEN is not set; lieber.org shows the release within three hours"; exit 0; fi
          gh api -X POST repos/kurtlieber/lieber.org/actions/workflows/deploy.yml/dispatches -f ref=main
          echo "::notice::Started lieber.org's deploy"

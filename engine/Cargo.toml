[package]
name = "needle-engine"
# Never bumped: the package version is ../VERSION (build.rs passes it in), so Cargo.lock stays put.
version = "0.1.0"
edition = "2024"
description = "needle's playback engine: librespot, a PCM tap for the spectrum, MPRIS, JSON over a Unix socket"
license = "MIT"
publish = false

[dependencies]
librespot-core = "0.8"
librespot-playback = { version = "0.8", default-features = false, features = ["native-tls"] }
# our own PulseAudio sink: a short buffer, flushed on pause, with a PCM tap for the spectrum
libpulse-binding = "2.30"
libpulse-simple-binding = "2.29"
librespot-oauth = "0.8"
librespot-metadata = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
realfft = "3"
mpris-server = { version = "0.10", features = ["tokio"] }
log = "0.4"
env_logger = "0.11"

[profile.release]
lto = "thin"
strip = true
